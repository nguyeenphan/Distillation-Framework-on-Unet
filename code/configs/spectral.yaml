# ──────────────────────────────────────────────
# Spectral-Directional Consistency
# Ablations are toggles here, not code paths:
#   A  baseline           → dùng configs/run2.yaml (Mean Teacher)
#   B  + L_style          → lambda_content: 0.0
#   C  + L_cont           → lambda_content: 1.0   (config này)
#   D  jitter twin        → data.style_twin: "jitter"   ← đối chứng quyết định
# ──────────────────────────────────────────────

seed: 42

data:
  train_dir: "../dataset/train"
  val_dir: "../dataset/val"
  test_dir: "../dataset/test"
  image_size: 256
  num_workers: 8
  base_image_only: false
  auxiliary_from_styles: true    # style twin donor = CAST variant CÙNG lá
  spectral: true
  style_twin: "spectral"         # "spectral" | "jitter" (ablation D)

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: 2
  in_channels: 3
  use_aspp: true
  aspp_rates: [6, 12, 18]

# StyCona ở đây chỉ là bộ sinh twin; mỗi nhánh chỉ dùng một trục.
stycona:
  enabled: true
  style_alpha_range: [0.1, 0.4]
  content_mix:
    enabled: true
    # t ~ U(lo, hi) mỗi sample — đúng tinh thần β~U(0,1) của paper.
    # Trần 0.7 verify bằng verify_content_labels.py với donor là ảnh gốc thật.
    # Đặt một số thay vì list nếu muốn cố định.
    t: [0.15, 0.7]
    top_k_ranks: 16              # đo được: bão hoà sau ~16, k không phải nút vặn
  per_channel_svd: true

spectral:
  lambda_content: 1.0            # 0.0 → ablation B
  lambda_style_max: 0.5          # thấp hơn Mean Teacher (1.0) — xem ghi chú
  style_rampup_epochs: 40
  fg_rate_floor: 0.005           # dừng run nếu prediction xẹp về toàn background

# Chỉ dùng khi style_twin: "jitter"
views:
  strong:
    color_jitter: 0.2
    random_gray_prob: 0.1
    gaussian_blur_prob: 0.3
  weak:
    color_jitter: 0.0
    random_gray_prob: 0.0
    gaussian_blur_prob: 0.0

loss:
  supervised:
    focal_weight: 1.0
    focal_gamma: 2.0
    focal_alpha: null
    dice_weight: 1.0
    l1_weight: 0.5

training:
  epochs: 150
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 0
  val_every: 5
  save_every: 0
  save_dir: "./checkpoints/spectral"
  log_dir: "./logs/spectral"
