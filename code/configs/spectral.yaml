# ──────────────────────────────────────────────
# Spectral-Directional Consistency
# Ablations are toggles here, not code paths:
#   A  baseline           → dùng configs/run2.yaml (Mean Teacher)
#   B  + L_style          → lambda_content: 0.0
#   C  + L_cont           → lambda_content: 1.0   (config này)
#   D  jitter twin        → data.style_twin: "jitter"   ← đối chứng quyết định
# ──────────────────────────────────────────────

seed: 42

data:
  train_dir: "../dataset/train"
  val_dir: "../dataset/val"
  test_dir: "../dataset/test"
  image_size: 256
  num_workers: 8
  base_image_only: false
  auxiliary_from_styles: true    # style twin donor = CAST variant CÙNG lá
  spectral: true
  style_twin: "spectral"         # "spectral" | "jitter" (ablation D)

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: 2
  in_channels: 3
  use_aspp: true
  aspp_rates: [6, 12, 18]

# StyCona ở đây chỉ là bộ sinh twin; mỗi nhánh chỉ dùng một trục.
stycona:
  enabled: true
  # Nới ra: [0.1,0.4] làm x_style ~ x, l_style tụt còn 0.6% tổng loss (no-op).
  style_alpha_range: [0.3, 0.7]
  content_mix:
    enabled: true
    # t ~ U(lo, hi) mỗi sample — đúng tinh thần β~U(0,1) của paper.
    # 0.7 là TRẦN label-validity của verify_content_labels.py, không phải giá trị
    # nên dùng: run trước l_cont đóng băng ở 0.33 (nhãn y không còn khớp x_content).
    # Về mức baseline default.yaml (t=0.1, k=3) để y còn hợp lệ.
    t: [0.05, 0.2]
    top_k_ranks: 3
  per_channel_svd: true

spectral:
  # Nhánh content mang nhãn gần-đúng → weight phụ, không ngang supervised.
  # Run trước lam_c=1.0 cho nó 58% gradient.
  lambda_content: 0.3            # 0.0 → ablation B
  # Bằng consistency_weight_max của default.yaml → spectral vs MT khác nhau
  # CHỈ ở twins, không ở hyperparameter.
  lambda_style_max: 1.0
  style_rampup_epochs: 30
  ema_decay: 0.999               # bằng default.yaml
  fg_rate_floor: 0.005           # dừng run nếu prediction xẹp về toàn background

# Chỉ dùng khi style_twin: "jitter"
views:
  strong:
    color_jitter: 0.2
    random_gray_prob: 0.1
    gaussian_blur_prob: 0.3
  weak:
    color_jitter: 0.0
    random_gray_prob: 0.0
    gaussian_blur_prob: 0.0

loss:
  consistency:
    type: "mse"                  # như Mean Teacher; KL batchmean scale gấp ~65k lần
  supervised:
    focal_weight: 1.0
    focal_gamma: 2.0
    focal_alpha: null
    dice_weight: 1.0
    l1_weight: 0.5

training:
  # Khớp default.yaml (baseline Dice 0.6512) để so sánh fair.
  epochs: 150
  batch_size: 16
  lr: 5.0e-4
  weight_decay: 0.0001
  warmup_epochs: 10
  val_every: 5
  save_every: 0
  save_dir: "./checkpoints/spectral"
  log_dir: "./logs/spectral"
